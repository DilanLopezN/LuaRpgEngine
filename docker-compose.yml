version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rpg-postgres
    environment:
      POSTGRES_USER: rpg
      POSTGRES_PASSWORD: rpg
      POSTGRES_DB: rpg
    ports:
      - "5432:5432"
    volumes:
      - rpg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpg -d rpg"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rpg-redis
    ports:
      - "6379:6379"
    volumes:
      - rpg_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./server
    container_name: rpg-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "host=postgres port=5432 user=rpg password=rpg dbname=rpg sslmode=disable"
      REDIS_ADDR: "redis:6379"
      LISTEN_ADDR: ":7777"
    ports:
      - "7777:7777"

volumes:
  rpg_pgdata:
  rpg_redisdata:
